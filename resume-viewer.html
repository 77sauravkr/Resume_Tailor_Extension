<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <link rel="stylesheet" href="resume-viewer.css">
</head>
<body>
  <header class="top no-print">
    <div class="brand">
      <span class="logo"></span>
      <div>
        <div id="title" class="title">Resume</div>
        <div id="sub" class="sub"></div>
      </div>
    </div>
    <div class="actions">
      <span id="save-status" class="save-status" hidden></span>
      <button id="btn-diff" class="secondary" hidden>Compare Changes</button>
      <button id="btn-copy-tex" class="secondary">Copy .tex</button>
      <button id="btn-dl-tex" class="secondary">Download .tex</button>
      <button id="btn-use-autofill" class="mint">Use for Autofill</button>
      <button id="btn-pdf" class="primary">Download PDF</button>
    </div>
  </header>

  <section id="diff-panel" class="diff-panel no-print" hidden></section>

  <main class="stage">
    <div id="resume-container" class="resume-paper" contenteditable="true" spellcheck="false"></div>
  </main>
  <p class="hint no-print">Click any text to edit (auto-saved) before exporting PDF, .tex, or setting it for Autofill.</p>

  <script src="doc-storage.js"></script>
  <script src="overleaf-renderer.js"></script>
  <script src="pdf-builder.js"></script>
  <script src="resume-viewer.js"></script>
</body>
</html>
